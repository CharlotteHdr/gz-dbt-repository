# schema.yml

version: 2

sources:
  - name: raw
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez / we have on row per product_id found in each orders_id
        loaded_at_field: CAST(date_date AS TIMESTAMP)
        freshness:
        warn_after: { 90 }
        columns:
          - name: date_date
            description: date of purchase
      - name: product
        identifier: raw_gz_product
        description: product of Greenweez / we have on row per product_id found in purchase_price
        columns:
          - name: products_id
            description: id of product
            tests:
              - not_null
      - name: ship
        identifier: raw_gz_ship
        description: ship of Greenweez / we have cost on orders_id
        columns:
          - name: orders_id
            description: orders
            tests:
              - not_null
